name: Lint

# Blocking ``ruff check .`` over the kept tree — enforces the explicit rules
# in ``[tool.ruff.lint.select]``. The upstream advisory-diff + ``ty`` job was
# retired with the hermes-severance rewrite (grove ships one lint gate).

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Install ruff
        run: uv tool install ruff@0.15.10

      - name: ruff check
        run: ruff check .
