name: Tests

# Grove's kept-tree suite. Runs the non-integration tests in parallel.
#
# NOTE: ``-m 'not integration'`` deselects the integration-marked tests under
# tests/integration/. The three tests/e2e/ files are NOT integration-marked at
# this HEAD, so they run here — flagged in the T5 report for marker
# reconciliation. Add ``@pytest.mark.integration`` (or an explicit
# ``--ignore=tests/e2e``) if they require live services.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Sizing: local full suite ~11 min on an M5; GitHub-hosted runners are
    # ~2-3x slower and add venv/dep-install overhead — 60 min gives headroom
    # without masking a genuine hang.
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[web,mcp,dev]"

      - name: Run tests
        run: |
          source .venv/bin/activate
          python -m pytest -m 'not integration' -n auto --tb=short -q
