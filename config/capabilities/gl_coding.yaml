# gl_coding.yaml — GL invoice-coding adapter for decision work.
# The tool that serves the gl-invoice-coding Dock goal: next uncoded invoice,
# record a proposed code, record the operator's decision. Offered on every turn
# at every tier; the goal's own isolation and queue checks decide what it does.
# family=decision_work  zone=green  tiers=[1,2,3]  disclosure=proactive  trigger=always
id: gl_coding
kind: verb
trigger:
  intents: []
  keywords: []
  dock_affinity: []
  always: true
  disclosure: proactive
bindings:
  tools:
  - gl_coding
  credentials: null
  toolset_key: null
tier_rule:
  eligible:
  - 1
  - 2
  - 3
  preferred: 1
  promotion_criteria: {}
  validation:
    strategy: shadow_compare
    confidence_threshold: 0.95
    shadow_window: 20
zone: green
telemetry:
  feed: intent_feed
  track:
  - invocation
  - result
  - cost
  - latency
  - confidence
  - human_feedback
context:
  disclosure: eager
  payload: 'GL invoice coding for the gl-invoice-coding goal (zone green; writes only the goal''s decision log). Tools: gl_coding.

    '
  dock_composition: none
lifecycle:
  state: approved
  provenance: operator_authored
  created_at: '2026-10-06T00:00:00+00:00'
  last_used: null
  use_count: 0
  flywheel_eligible: true
lineage:
  source_patterns: []
  parent_id: null
  decision_log:
  - actor: operator
    timestamp: '2026-10-06T00:00:00+00:00'
    from_state: proposed
    to_state: approved
    reason: 'decision-work adapter for the gl-invoice-coding Dock goal; operator-approved
      design, 2026-10-05'
    evidence:
    - config/zones.schema.yaml#tool_zones
failure:
  fallback: halt_and_surface
  diagnostic_context:
  - 'capability: gl_coding'
  - 'subsystem: decision work (grove.decision_work) + GL adapter (tools.gl_coding_tool)'
  - 'check: tool registered + zone mapped in zones.schema.yaml'
  circuit_breaker:
    threshold: 3
    window_seconds: 300
