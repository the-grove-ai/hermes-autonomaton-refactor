# Grove Disclosure Manifest (DECLARATIVE half) — Sprint 74 Phase 3.
#
# Only the units with NO registry source live here: MCP servers, goals,
# contract sections. Tool units are DERIVED live from the registry by
# grove.manifest.build_manifest (oneline from the tool description, tiers
# from tool_groups x tier_budgets) and MERGED with these at load. ids are
# globally unique across derived + declarative (fail-loud collision).
#
# mcp units flip allow-by-default -> disclose-on-match (trigger required).
# payload is a POINTER (mcp_schema:<server>, goal_record:<id>), never inlined.
version: 1
# GRV-009 E4 C4 — the `notion` mcp unit was retired here. MCP delivery is now
# sole-path through the kind=mcp Capability records (config/capabilities/
# notion_*.yaml): gating (tier_rule.eligible + trigger) AND attribution. The
# disclosure-index one-liner for MCP is RETIRED with it — MCP discloses eagerly
# on a trigger-matched eligible-tier turn (no manifest index backdoor). A missed
# match is fixed by broadening a record's trigger (declarative governance), not
# a hidden index-pull. Goal and contract units remain declarative below.
#
# The goal unit below is a generic reference example, consistent with the
# shipped dock template (config/dock/dock.yaml). The operator's real goals
# live on instances only ($GROVE_HOME/dock/) and are never committed here.
units:
- id: first-fleet-worker
  kind: goal
  oneline: 'Goal [apex_strategic / staging]: Ship your first governed fleet worker'
  payload: goal_record:first-fleet-worker
  tiers:
  - T2
  - T3
  trigger:
    intents: []
    keywords:
    - fleet
    - worker
    - cadence
    - pending_review
    - approval
    dock_goal: first-fleet-worker
