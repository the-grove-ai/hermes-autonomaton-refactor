# ============================================================================
# portal.nav.yaml — the Operator Portal's left navigation, declared
# ============================================================================
#
# Repo-shipped default. An operator file at ~/.grove/portal.nav.yaml, if
# present, replaces this one whole. The nav is only navigation and labels: no
# entry changes what a page shows, and every target is an existing page.
#
# The order tells the story: do the work, sign what it learned, see the
# result and check the record. How the node is set up comes after. Every goal
# is still reachable from the goal page's own link to the list of goals.
#
# An item is one of:
#   {label, target}                    a link to an existing page
#   {label, target, badge}             ...with a live count (to_sign, suggestions)
#   {goals_with_work: true}            one link per Dock goal that declares work
#   {scheduled_skills: true}           one link per skill that runs on a schedule
#   {label, items: [...]}              a sub-group
# Any item may name a `flag`; it is shown only while that flag is true.
# An item marked `demo_only: true` is shown only while the portal is in demo mode.
# ============================================================================

# The page the portal opens on. `first_goal_with_work` is the first Dock goal
# that declares decision work; or give a target such as fragments/dock/goals.
landing: first_goal_with_work

flags:
  # Skills that run on a schedule or a loop (researcher, cultivator, drafter,
  # scout). Off: they do not appear in the nav at all.
  scheduled_skills: false

# Skills never listed in the nav, whatever the flags say. Nothing about them
# is deleted: their configuration and records stay where they are.
hidden_skills: [forge-jobsearch, scout-jobsearch]

groups:
  # The dock: one shared context. Its work, what is waiting for a signature,
  # what the work returned, and the record behind it, in the order the story
  # is told. The trace is the proof; the audit check is the check on the proof.
  - label: Dock
    items:
      - goals_with_work: true
      # What changes the system's authority, and so needs your signature: keg
      # versions, session rules, Kaizen's requests. The badge counts only these.
      - {label: To sign, target: "fragments/proposals/pending?type=signature", badge: to_sign}
      - {label: Scorecard, target: fragments/audit/}
      - {label: Reasoning trace, target: fragments/trace/}
      - {label: Audit check, target: "fragments/audit/?at=audit-integrity"}
      # Save the node's records at one moment and put them back. Demo mode only.
      - {label: Checkpoints, target: fragments/checkpoints/, demo_only: true}

  - label: Admin
    items:
      - {label: Models, target: fragments/binding/panel}
      - {label: Connected tools, target: fragments/composition/panel}
      - {label: Skills, target: fragments/skills/}
      - {label: On a schedule, flag: scheduled_skills, indent: true, items: [{scheduled_skills: true}]}
      - {label: Knowledge, target: fragments/cellar/pages}
      - {label: Memory, target: fragments/memory/records}
      # Approved in conversation or here; no signature. Counted on their own.
      - {label: Suggestions, target: "fragments/proposals/pending?type=memory", badge: suggestions, indent: true}

  - label: Advanced
    items:
      - {label: Tool permissions, target: fragments/capabilities/admission}
      - {label: System, target: fragments/dashboard/overview}
