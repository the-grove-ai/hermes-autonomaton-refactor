# ============================================================================
# Grove Autonomaton — Sovereignty Guardrails Schema (v2 · scope-keyed)
# ============================================================================
#
# Location:     config/zones.schema.yaml   (repo default — the runtime loads
#                                            THIS file from the repo path)
#               ~/.grove/zones.autonomaton.yaml (operator overlay — v2 valid-key
#                                            surface is red_denied_by_policy +
#                                            schema_version ONLY; see loader)
#
# Purpose:      Declarative zone boundaries for the Autonomaton pipeline.
#               The Sovereignty Gate reads this file to classify every
#               action as Green (autonomous), Yellow (supervised), or
#               Red (sovereign — operator holds directly).
#
# Canonical ref: GRV-001 v2.0 §III — "zone boundaries key on operator SCOPE,
#               not action CATEGORY." Category keying is FORBIDDEN.
#
# ── What changed in v2 (zones-v2-scope-keying) ─────────────────────────────
# The published standard forbids category keying: a write's zone derives from
# WHAT IT TOUCHES (operator scope), not what KIND of action it is. v1 carried
# 164 category-keyed entries (137 bare tool-name→zone assignments, 13 dead
# terminal.rules shell patterns, action-type pattern blocks). v2 makes the
# ENFORCED schema scope-keyed and self-describing:
#
#   * Tools declare an EFFECT CLASS (six, closed). The zone is DERIVED at load
#     from the declared derivation rules below — the schema says what the code
#     enforces, in load-bearing content, not loader-ignored commentary.
#   * Scope membership is BY REFERENCE to config/scope_surfaces.yaml (the single
#     membership source is_scope_defining already consumes) — NEVER duplicated.
#   * The action-type pattern blocks (zones.green/yellow/red) and the dead
#     terminal.rules are RETIRED. Shell/execute_code commands are classified by
#     EFFECT via the bashlex-AST classifier (grove/shell_effects.py); this file
#     no longer carries shell regex.
#
# Hot-reload: SIGHUP re-reads this file (see grove/zones.py reload()).
# ============================================================================

schema_version: 2

# ── DENIED_BY_POLICY deny-list (read by grove/red_policy.py, NOT the zones
# loader). A RED action whose AST-derived pattern_key matches an entry here is
# NEVER store-pending and NEVER executed. The catastrophic-rm effect
# ("rm:catastrophic") is a HARDCODED floor, denied even if this key is empty.
# This is one of the two keys a v2 operator OVERLAY may carry (the other is
# schema_version). Editing it is a RED governed change (propose_governance_change).
red_denied_by_policy: []

# ============================================================================
# Effect classes — the SIX closed classes and their derivation rules.
# ----------------------------------------------------------------------------
# ENFORCED content: the loader (grove/zones.py::_load_v2) reads `derives` here
# and computes each tool's zone from its declared class. Changing a `derives`
# value re-derives every tool in that class — the derivation is live, not a
# baked lookup table. The enum is CLOSED: the loader rejects a schema that adds,
# removes, or renames a class, and rejects a tool declaring a class not listed.
# ============================================================================
effect_classes:
  read_only:
    derives: green
    description: |
      No operator-scope write effect. Autonomous. Reads are gated by the
      secrets wall ONLY (see read_authority below) — scope-defining surfaces
      remain READABLE (their WRITES are RED; their reads are permitted).
  contained_write:
    derives: green
    description: |
      A write confined to a jailed system-internal sink with no operator-scope
      surface — autonomous. REQUIRES a containment citation from source at each
      entry (see tool_effects); a class assignment without a cited containment
      primitive is REFUSED at load (no citation, no class).
  workspace_write:
    derives: yellow
    description: |
      A filesystem write. The zone is decided by WHAT THE TARGET TOUCHES: the
      scope wall (grove/utils/fs_utils.py::is_scope_defining, consuming
      config/scope_surfaces.yaml) routes a scope-defining target RED and a
      granted-workspace target GREEN at the dispatcher write door (Seam-β) and
      the shell AST. At the bare tool-name gate (no extractable target) the
      class derives YELLOW — fail-toward-operator (the R-4 posture).
  external_effect:
    derives: yellow
    description: |
      An effect outside the local filesystem (a message, an API mutation, a
      service call) or a governance-APPLICATION tool whose act is the operator's
      mechanical tap. Supervised — the Sovereign Prompt governs it. YELLOW.
  governance:
    derives: red
    description: |
      Mutates the agent's OWN authority / sovereignty state (skill promotion,
      grant/zone-rule writes, semantic revocation of a prior approval). RED.
      Red + valid Grant Token = execute; Red + agent-synthesized = sovereignty
      prompt. governance is for AUTHORITY mutation ONLY.
  operator_only:
    derives: red
    description: |
      A sovereign-held security/system surface the autonomaton cannot operate
      (OS keystroke injection, shared-service role administration). RED — the
      code path to execute it through tool dispatch does not exist by design.

# ── Default posture for an unmatched action (DECLARED enforced semantics).
# grove/zones.py::classify returns this zone with source="default" for any
# action carrying no tool_effects entry. Conservative fail-toward-operator
# (GRV-001 v2.0; R-4 ruling — a designed posture, not a silent fallback).
default_unmatched: yellow

# ── Read authority (the secrets wall) — DECLARED, not enforced here.
# read_only derives GREEN, but generic file-tool READS are independently gated
# by grove/utils/fs_utils.py::is_secret_path (secrets + system paths), the SOLE
# read wall post secrets-only-wall-v1. Scope-defining surfaces stay readable
# (writes RED, reads permitted). This block names that authority for a schema
# reader; it does not re-implement it.
read_authority:
  read_wall: grove/utils/fs_utils.py::is_secret_path
  note: |
    Reads are gated by the secrets wall only. Scope-defining surfaces remain
    readable — their writes are RED, their reads are permitted. Current
    behavior, preserved and now declared.

# ── Scope membership — BY REFERENCE. is_scope_defining consumes
# config/scope_surfaces.yaml (the single membership source). This schema
# declares the MODEL and references that file BY NAME; it NEVER duplicates the
# member list. (declared-surfaces-v1 later evolves scope_surfaces.yaml; this
# sprint does not fork it.)
scope_membership:
  source: config/scope_surfaces.yaml
  consumer: grove/utils/fs_utils.py::is_scope_defining
  note: |
    A workspace_write target is classified by is_scope_defining against the
    members declared in scope_surfaces.yaml (dual anchor: GROVE_HOME tree +
    the running tree's <module_root>/config/). No membership is duplicated here.

# ============================================================================
# Tool → effect class.  classify(<tool_name>) derives the tool's zone from its
# class via the rules above. Tool identifiers are the bare names yielded in
# ToolIntent.tool_name (grove/dispatcher._classify_one_intent). A tool with no
# entry here derives `default_unmatched` (yellow).
#
# Behavior parity (zones-v2-scope-keying P1b): every derived zone equals the
# v1 baseline zone. See the sprint's parity map. (The v1 `memory: green` entry
# is RETIRED — the legacy builtin memory tool is forbidden by the registry
# invariant tools/registry.py:120-133, so no ToolIntent carries tool_name
# "memory"; the entry was residue and is deleted, not a zone divergence.)
# ============================================================================
