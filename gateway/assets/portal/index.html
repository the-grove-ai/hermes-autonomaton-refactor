<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Operator Portal — Knowledge Browser</title>
    <link rel="stylesheet" href="/portal/static/style.css">
    <!-- R2″ node-compositor-view-v1 — scoped polish for the composition panel.
         Functional only (dim dark nodes, monospace tool rows, inversion arrow);
         all colors reuse the existing :root palette so the dark theme holds. -->
    <style>
      .composition-card.dark-node { opacity: 0.6; }
      .composition-card .dark-note { font-style: italic; }
      .composition-card .tool-row { display: flex; align-items: center; gap: 0.5rem; }
      .composition-card .tool-name {
          font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
          font-size: 0.85rem; color: var(--text);
      }
      .composition-card .zone-arrow { color: var(--text-dim); font-weight: 700; }
    </style>
    <script src="/portal/static/htmx.min.js" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="brand">grove-autonomaton <span class="brand-sub">Operator Portal</span></div>
        <div class="search-wrap">
            <input type="search" name="q" placeholder="Search knowledge, memory and goals…"
                   autocomplete="off"
                   hx-get="/portal/fragments/search"
                   hx-include="this"
                   hx-trigger="keyup changed delay:300ms"
                   hx-target="#center-panel"
                   hx-sync="closest input:replace"
                   hx-indicator="#search-spinner">
            <span id="search-spinner" class="htmx-indicator spinner">searching…</span>
        </div>
    </header>

    <!-- portal-action-error-surfacing-v1 P2 — persistent, always-present OOB
         target for non-destructive action-failure alerts. Empty [hidden] takes
         no layout space; the responseError handler below (and P3's server-rendered
         #alert-banner OOB fragment) populate it WITHOUT touching #center-panel,
         so surfacing a failure never wipes what the operator is reading. -->
    <div id="alert-banner" class="alert-banner" role="alert" aria-live="assertive" hidden></div>

    <div class="layout">
        <!-- fleet-ui-reconciliation-v1 C1 — ONE navigation mechanism, portal-wide:
             every nav item is a hash anchor. Clicking sets location.hash; the
             hash router below dispatches the fragment into #center-panel. The
             hash URL is what lands in history, so reload and back/forward always
             re-enter the shell, and exactly one dispatcher (the router) fires
             per navigation (F1). htmx history (hx-push-url) is NOT used anywhere
             in the portal — a second history actor cannot guarantee that. -->
        <nav class="left-panel" aria-label="Sections">
            <!-- The nav is declared in config/portal.nav.yaml (or the
                 operator's ~/.grove/portal.nav.yaml) and rendered by
                 /portal/fragments/nav/main, with its live counts. It is
                 redrawn when a proposal is signed or dismissed, so the
                 counts track the queue. -->
            <ul class="nav-list" id="main-nav"
                hx-get="/portal/fragments/nav/main"
                hx-trigger="load, proposal-disposition from:body, fleet-disposition from:body"
                hx-swap="innerHTML"></ul>
            <!-- Without scripts the plain links below still reach every page. -->
            <noscript>
            <ul class="nav-list">
                <li><a href="/portal#fragments/dashboard/overview">Dashboard</a></li>
                <li><a href="/portal#fragments/cellar/pages">Knowledge</a></li>
                <!-- fleet-ui-reconciliation-v1 C2 — data-driven Fleet outline.
                     Loads on shell boot; a disposition response's
                     HX-Trigger: fleet-disposition header re-fires it so the
                     badges track the queue. The static link is the fallback
                     until the fragment lands. -->
                <li class="nav-fleet" hx-get="/portal/fragments/nav/fleet"
                    hx-trigger="load, fleet-disposition from:body"
                    hx-swap="innerHTML">
                    <a href="/portal#fragments/fleet/">Fleet</a></li>
                <li><a href="/portal#fragments/memory/records">Memory</a></li>
                <li><a href="/portal#fragments/dock/goals">Goals</a></li>
                <!-- fleet-ui-reconciliation-v1 C3 — badge counts what the
                     pending page renders (non-artifact proposals + memory
                     items, same partition). Refreshed by the
                     proposal-disposition HX-Trigger event. -->
                <li class="nav-proposals" hx-get="/portal/fragments/nav/proposals"
                    hx-trigger="load, proposal-disposition from:body"
                    hx-swap="innerHTML">
                    <a href="/portal#fragments/proposals/pending">Proposals</a></li>
                <li><a href="/portal#fragments/skills/">Skills</a></li>
                <!-- capability-mutation-surface-v1 P6/P7 — effective admission state -->
                <li><a href="/portal#fragments/capabilities/admission">Admission</a></li>
                <li><a href="/portal#fragments/composition/panel">Composition</a></li>
                <li><a href="/portal#fragments/binding/panel">Models</a></li>
                <!-- The audit: is the record intact, and what did the work cost. -->
                <li><a href="/portal#fragments/audit/">Audit</a></li>
                <!-- Every decision of the current run, step by step, from records. -->
                <li><a href="/portal#fragments/trace/">Trace</a></li>
            </ul>
            </noscript>
        </nav>

        <main id="center-panel" class="center-panel">
            <div class="welcome">
                <h1>Operator Portal</h1>
                <p>This is where you see the work Mylo is doing, sign what it
                has learned, and check the record of every decision.</p>
            </div>
        </main>

        <aside id="right-panel" class="right-panel" aria-label="Context">
            <p class="placeholder">Context appears here when you open an item.</p>
        </aside>
    </div>

    <script>
      // portal-action-error-surfacing-v1 P2 — NON-DESTRUCTIVE failure surface.
      // Was: blanked #center-panel with a generic error card (destructive — it
      // wiped whatever the operator was reading). Now: drives the persistent
      // #alert-banner and leaves #center-panel untouched. If the failure response
      // carried a server-rendered #alert-banner OOB fragment (P3's
      // _loud_action_failure via render_alert_banner), its content is used
      // verbatim; otherwise a generic status alert. htmx 2.x does NOT swap 4xx/5xx
      // bodies ([45].. -> swap:false,error:true), so this listener is the delivery
      // hook — one body-level chokepoint, so every existing caller becomes
      // non-destructive automatically. The listener symbol is preserved, only
      // repointed.
      document.body.addEventListener('htmx:responseError', function(evt) {
          var banner = document.getElementById('alert-banner');
          if (!banner) { return; }
          // Always-on floor: a generic status alert renders on ANY responseError
          // (the frontend analog of notify.py Leg 1). Status is read defensively
          // so a malformed event can never suppress the floor.
          var status = '';
          try { status = evt.detail.xhr.status; } catch (e) { status = ''; }
          var fallback = '<div class="alert alert-error">'
              + '<button type="button" class="alert-dismiss" aria-label="Dismiss">'
              + '&times;</button>'
              + '<strong>Action failed.</strong> ' + (status ? status + ': ' : '')
              + 'Check the logs.</div>';
          // Upgrade branch (dormant until P3): lift the server-rendered
          // #alert-banner OOB fragment when the failure response carried one. ANY
          // failure to extract a NON-EMPTY fragment — a throw, a missing node, or
          // empty content — falls through to the floor. A lift error must never
          // leave the banner empty.
          var lifted = null;
          try {
              var tmp = document.createElement('div');
              tmp.innerHTML = (evt.detail.xhr && evt.detail.xhr.responseText) || '';
              var oob = tmp.querySelector('#alert-banner');
              if (oob && oob.innerHTML.trim()) { lifted = oob.innerHTML; }
          } catch (e) { lifted = null; }
          banner.innerHTML = lifted || fallback;
          banner.hidden = false;
      });

      // portal-action-error-surfacing-v1 P3.5 — banner lifecycle. Two clear
      // paths, NEITHER touches the responseError floor above: a fresh failure
      // still sets banner unconditionally (lifted || fallback, hidden=false), so
      // neither path can suppress the next error. Within one request only one of
      // {afterOnLoad, responseError} fires (htmx gates afterOnLoad on shouldSwap
      // = 2xx; responseError on isError = 4xx/5xx), so a fresh error always wins
      // its own request.
      function _clearAlertBanner() {
          var banner = document.getElementById('alert-banner');
          if (banner) { banner.innerHTML = ''; banner.hidden = true; }
      }
      // 1. Manual dismiss — DELEGATED on document so it survives the banner's
      //    innerHTML being replaced by each new alert. Clears the CURRENT banner.
      document.addEventListener('click', function(evt) {
          if (evt.target.closest && evt.target.closest('.alert-dismiss')) {
              _clearAlertBanner();
          }
      });
      // 2. Auto-clear-on-success. CROSS-SPRINT CORRECTION
      //    (fleet-artifact-legibility-v1 C4): the bundled htmx fires
      //    afterOnLoad on 4xx/5xx responses TOO (observed event order on an
      //    error: beforeSwap → responseError → afterOnLoad), so an ungated
      //    clear wiped a fresh error banner the instant the responseError
      //    handler rendered it. Gate on a genuinely successful status; a
      //    subsequent successful action still clears a stale banner. NO timer.
      document.body.addEventListener('htmx:afterOnLoad', function(evt) {
        var xhr = evt.detail && evt.detail.xhr;
        if (xhr && xhr.status < 400) { _clearAlertBanner(); }
      });

      // Scorecard chart — hovering, focusing or clicking a bar writes that
      // item's record to the chart's status line. DELEGATED on document so it
      // survives every fragment swap; the text is server-rendered on the bar.
      function _scorecardPick(evt) {
          var bar = evt.target.closest && evt.target.closest('[data-sc-detail]');
          if (!bar) { return; }
          var line = document.getElementById(bar.getAttribute('data-sc-target'));
          if (line) { line.textContent = bar.getAttribute('data-sc-detail'); }
      }
      ['mouseover', 'focusin', 'click'].forEach(function(name) {
          document.addEventListener(name, _scorecardPick);
      });
    </script>
    <!-- portal-link-provider-v1 — hash router. Deep links use
         {base_url}/portal#fragments/... so the operator always lands in the
         full styled shell; this then dispatches the fragment into #center-panel.
         The ?q= on a search link rides the hash in the browser URL and becomes
         a real query string when htmx.ajax sends the GET. HTMX loads with
         `defer`, so the htmx global is available at DOMContentLoaded. -->
    <script>
    // cellar-link-resolution-v1 (Scope 1) — hash routing fires on BOTH the
    // initial load AND every subsequent hashchange. A deep link activated while
    // the portal is already open (a push note, a pasted link, an in-shell
    // [View in portal] citation) changes only the URL hash; DOMContentLoaded
    // alone never fired again, so the fragment silently failed to load. The
    // hashchange binding closes that gap. Dispatch is identical to the original
    // cold-load path — same htmx.ajax GET, same target — no new routing logic.
    //
    // fleet-ui-reconciliation-v1 C1 (F1) — this router is the SINGLE history
    // dispatcher. All portal navigation (sidebar + in-fragment links) is hash
    // anchors; hx-push-url is gone portal-wide, so htmx never writes history
    // and never restores on popstate. Back/forward therefore fires exactly one
    // hashchange → one fetch per navigation. Bare /portal (no hash) dispatches
    // nothing and shows the shell's default center-panel content (F2).
    var _lastRoutedHash = null;
    function handleHashRoute() {
      var hash = window.location.hash.substring(1);
      if (!hash) { return; }
      // Double-fire guard: a single hash value is dispatched once. Protects the
      // cold-load case where DOMContentLoaded and an immediate hashchange can
      // both observe the same initial hash.
      if (hash === _lastRoutedHash) { return; }
      _lastRoutedHash = hash;
      htmx.ajax('GET', '/portal/' + hash, {target: '#center-panel'});
    }
    document.addEventListener('DOMContentLoaded', handleHashRoute);
    // The portal opens on the page the declared nav names (its `landing`),
    // and only when no page was asked for: a deep link always wins. A target
    // may carry ?at=<element id> to show one part of a page (the audit check
    // sits below the scorecard on the same page).
    document.body.addEventListener('htmx:afterSwap', function(evt) {
      var el = evt.target;
      if (el && el.id === 'main-nav' && !window.location.hash) {
        var landing = document.getElementById('nav-landing');
        if (landing && landing.dataset.landing) {
          window.location.hash = landing.dataset.landing;
        }
      }
      if (el && el.id === 'center-panel') {
        var at = /[?&]at=([A-Za-z0-9_-]+)/.exec(window.location.hash);
        var part = at && document.getElementById(at[1]);
        if (part) { part.scrollIntoView({block: 'start'}); }
        else { window.scrollTo(0, 0); }
      }
    });
    window.addEventListener('hashchange', handleHashRoute);
    // Re-clicking the CURRENT hash fires no hashchange event (the URL does not
    // change), and the guard would suppress a manual re-dispatch — so a
    // delegated click listener treats a same-hash nav as an explicit refresh.
    // (Replaces the htmx:pushedIntoHistory guard-reset, which is obsolete now
    // that nothing pushes hash-less URLs.)
    document.body.addEventListener('click', function(evt) {
      var a = evt.target.closest && evt.target.closest('a[href*="#fragments/"]');
      if (!a) { return; }
      var target = (a.getAttribute('href').split('#')[1] || '');
      if (target && target === window.location.hash.substring(1)) {
        _lastRoutedHash = null;
        handleHashRoute();
      }
    });

    // fleet-ui-reconciliation-v1 C4 (C2 carry-over) — nav expansion
    // persistence. The outline nav fragment re-renders (server defaults) on
    // every refresh; sessionStorage keeps the operator's open/closed choices
    // keyed by data-nav-key and re-applies them after each swap. Until the
    // operator first toggles a node, the server defaults stand.
    function _navOpenSet() {
      try {
        return new Set(JSON.parse(sessionStorage.getItem('navOpen') || '[]'));
      } catch (e) { return new Set(); }
    }
    document.body.addEventListener('click', function(evt) {
      var node = evt.target.closest &&
        evt.target.closest('.nav-fleet .nav-node[data-nav-key]');
      if (!node) { return; }
      // The inline toggle onclick has already run (element handlers fire
      // before this delegated one), so classList reflects the NEW state.
      var set = _navOpenSet();
      if (node.classList.contains('open')) { set.add(node.dataset.navKey); }
      else { set.delete(node.dataset.navKey); }
      sessionStorage.setItem('navOpen', JSON.stringify(Array.from(set)));
    });
    document.body.addEventListener('htmx:afterSwap', function(evt) {
      var el = evt.target;
      if (!el.classList || !el.classList.contains('nav-fleet')) { return; }
      if (sessionStorage.getItem('navOpen') === null) { return; }
      var set = _navOpenSet();
      el.querySelectorAll('.nav-node[data-nav-key]').forEach(function(n) {
        var open = set.has(n.dataset.navKey);
        n.classList.toggle('open', open);
        var k = n.nextElementSibling;
        if (k && k.classList.contains('kids')) { k.classList.toggle('open', open); }
      });
    });
    </script>
</body>
</html>
